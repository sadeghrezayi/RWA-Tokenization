# CI — the enforcement layer for the project's Definition of Done (test
# strategy §6). Runs the full verification battery on every push and PR:
# lint, typecheck, unit (api+web), contracts, builds, a migration check
# against an empty database, and the integration suite against real
# Postgres + IPFS + anvil with freshly deployed contracts.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# statuses: write is what lets a failed browser run publish its failing test
# names as commit statuses — the only failure detail readable without admin
# rights on this repository (KNOWN_ISSUES K-25). Everything else stays read.
permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dev/test values only — never production secrets. The mnemonic is the
  # public well-known anvil test mnemonic.
  DATABASE_URL: postgresql://tokenization:tokenization@127.0.0.1:5432/tokenization
  AUTH_TOKEN_SECRET: ci-only-token-secret-not-for-production
  DEVNET_RPC_URL: http://127.0.0.1:8545
  IPFS_API_URL: http://127.0.0.1:5001
  PLATFORM_OPERATOR_MNEMONIC: "test test test test test test test test test test test junk"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tokenization
          POSTGRES_PASSWORD: tokenization
          POSTGRES_DB: tokenization
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U tokenization"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      ipfs:
        image: ipfs/kubo:v0.34.1
        ports:
          - "5001:5001"
        options: >-
          --health-cmd "ipfs id"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads packageManager from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @tokenization/api exec prisma generate

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format

      - name: Typecheck
        run: pnpm -r typecheck

      # The failure diagnostic only runs on a red build, so on a healthy repo it
      # is never exercised — and a diagnostic that has silently rotted is worse
      # than none, because the outage is when you find out. This runs the step's
      # OWN script out of this file against a sample log and checks it publishes
      # what it claims to (KNOWN_ISSUES K-31). Node only, no network, ~instant.
      - name: Verify the failure diagnostic still works
        run: node .github/scripts/verify-api-failure-step.mjs

      - name: Contract tests (Foundry)
        working-directory: contracts
        run: forge test -vv

      - name: API unit tests
        run: pnpm --filter @tokenization/api test

      - name: Web tests
        run: pnpm --filter @tokenization/web test

      - name: Build API
        run: pnpm --filter @tokenization/api build

      - name: Build web
        run: pnpm --filter @tokenization/web build

      - name: Migration check (apply all migrations to empty database)
        run: pnpm --filter @tokenization/api exec prisma migrate deploy

      - name: Start anvil devnet
        timeout-minutes: 2
        run: |
          # Its own log, and not the step's stdout: a background process holding
          # the step's output open is its own way of hanging a job (K-32).
          anvil --mnemonic "$PLATFORM_OPERATOR_MNEMONIC" > "$RUNNER_TEMP/anvil.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' \
              http://127.0.0.1:8545 >/dev/null; then break; fi
            sleep 1
          done

      - name: Deploy contracts to devnet
        working-directory: contracts
        # BOUNDED for the reason the restart step below is: this step hung for
        # 22 minutes on 9231f7a and the job died at its 25-minute budget,
        # reporting "cancelled" with no failing test — the third time this class
        # of defect has cost a diagnosis (K-22, K-32). A deploy that takes
        # longer than five minutes is broken, and failing at five leaves the
        # rest of the battery its budget.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          forge script script/Deploy.s.sol --rpc-url http://127.0.0.1:8545 --broadcast | tee deploy.log
          grep -E '^\s*(ONCHAINID_CLAIM_ISSUER_ADDRESS|ATTESTATION_REGISTRY_ADDRESS)=' deploy.log \
            | sed 's/^ *//' >> "$GITHUB_ENV"

      # A CI-only failure has to carry its own evidence: job logs are 403 to an
      # anonymous reader, so a devnet that died silently would otherwise leave
      # nothing to diagnose (K-25).
      - name: Surface the devnet log when the deploy fails
        if: failure()
        run: cat "$RUNNER_TEMP/anvil.log" || true

      # `--outputFile` is relative to services/api, because `pnpm --filter` runs
      # the script with THAT as its working directory. Writing
      # "services/api/integration-report.json" here lands the file in
      # services/api/services/api/, where the reporter step never looks — which
      # is how two runs published nothing and looked like a broken parser.
      # A YAML comment, not a shell one: `run: >` folds its lines into a single
      # command, so a `#` inside would comment out the rest of that line.
      - name: Integration tests (Postgres + IPFS + anvil)
        run: >
          pnpm --filter @tokenization/api test:integration
          --reporter=default --reporter=json
          --outputFile=integration-report.json

      # The same treatment the browser suite already gets, for the same reason:
      # job logs need admin rights to read, so a CI-only integration failure was
      # invisible from outside and had to be guessed at. It cost a cycle on
      # `53a6139`, where the full battery passed locally (K-25).
      - name: Publish the failing integration tests where they can be read
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'services/api/integration-report.json';
            if (!fs.existsSync(path)) {
              // Publishing this rather than logging it: a silent return is
              // indistinguishable from "no failures", and that ambiguity cost
              // two cycles on `3a9de2c` and `3b03ee0`.
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: 'failure',
                context: 'integration-report-missing',
                description: `no report at ${path} — the run died before writing one, or the path is wrong`,
              });
              return;
            }
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const failures = [];
            for (const file of report.testResults ?? []) {
              const name = (file.name ?? '').split('/').pop();
              let failedHere = 0;
              for (const test of file.assertionResults ?? []) {
                if (test.status !== 'failed') continue;
                failedHere += 1;
                // The assertion message names WHAT broke; the title alone only
                // says where. A CI-only failure needs both to be diagnosable.
                const detail = (test.failureMessages ?? [])
                  .join(' ')
                  .replace(/\u001b\[[0-9;]*m/g, '')
                  .split('\n')
                  .map((line) => line.trim())
                  .filter(Boolean)[0] ?? '';
                failures.push(`${test.title.slice(0, 40)} :: ${detail}`.slice(0, 130));
              }
              // A SUITE-level failure — a beforeAll hook throwing, or the file
              // failing to import — reports no failing assertion at all: vitest
              // marks the file failed, skips every test, and leaves `message`
              // empty. Reporting only assertions published NOTHING for exactly
              // that case on `3a9de2c`, which is how a red build stayed
              // unexplained. The file name is the one signal available, and it
              // is enough to know where to look.
              if (file.status === 'failed' && failedHere === 0) {
                const skipped = (file.assertionResults ?? []).length;
                failures.push(
                  `SUITE ${name} failed before its tests ran (hook or import); ${skipped} skipped`.slice(0, 130),
                );
              }
            }
            core.info(`failing integration tests: ${failures.length}`);
            for (const [i, description] of failures.slice(0, 8).entries()) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: 'failure',
                context: `integration-failure-${i + 1}`,
                description,
              });
            }

      # A FRESH devnet for the browser journey, for the same reason the
      # integration suite gets its own database: a suite must not inherit a
      # resource the previous suite exhausted. By this point anvil has carried
      # the whole integration run, and a node in that state answers reads in
      # milliseconds while taking SECONDS per transaction — measured 2026-08-18
      # on two nodes side by side, 101 ms fresh against 4121 ms aged for the
      # identical one-contract deploy (KNOWN_ISSUES K-23). Tokenizing an asset
      # is dozens of transactions, so the exit journey burns its 240-second
      # budget inside POST /assets/:id/tokenize and dies with a timeout that
      # names nothing. Same code against a fresh node: 3 journeys in 45 s.
      - name: Restart the devnet before the browser journey
        working-directory: contracts
        # BOUNDED, because I wrote this step unbounded and it did exactly what
        # K-22 documented: it hung for 21 minutes and the job died at its
        # 25-minute budget, reporting "cancelled" with no failing test. Five
        # minutes is ten times what this needs.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          pkill -f 'anvil --mnemonic' || true
          # Wait for the port to be RELEASED before binding it again: a new
          # anvil that loses the race exits with "address in use", while the
          # old one keeps answering, so the readiness check below passes and
          # the whole step proceeds against a node it believes it restarted.
          for _ in $(seq 1 20); do
            if ! nc -z 127.0.0.1 8545 2>/dev/null; then break; fi
            sleep 1
          done
          # Its own log, and not the step's stdout: a background process
          # holding the step's output open is its own way of hanging a job.
          anvil --mnemonic "$PLATFORM_OPERATOR_MNEMONIC" > "$RUNNER_TEMP/anvil-restart.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' \
              http://127.0.0.1:8545 >/dev/null; then break; fi
            sleep 1
          done
          curl -sf -X POST -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' \
            http://127.0.0.1:8545 >/dev/null || {
              echo "the restarted devnet never answered"; cat "$RUNNER_TEMP/anvil-restart.log"; exit 1;
            }
          # New chain, new addresses — the API must be told, and it has not
          # started yet, so these land before it reads its environment.
          forge script script/Deploy.s.sol --rpc-url http://127.0.0.1:8545 --broadcast | tee redeploy.log
          grep -E '^\s*(ONCHAINID_CLAIM_ISSUER_ADDRESS|ATTESTATION_REGISTRY_ADDRESS)=' redeploy.log \
            | sed 's/^ *//' >> "$GITHUB_ENV"

      # Layout-regression harness: assertion-based contracts (no pixel
      # baselines — a macOS render would never match this runner's). Needs the
      # API and the web build actually serving, so it runs after both are built.
      # Bounded on purpose: this download has hung on the CDN before, and with
      # no step timeout it ate the whole 25-minute job budget and reported the
      # run as "cancelled" with no failing test to point at (KNOWN_ISSUES K-22).
      # A step that dies at 8 minutes names itself.
      # NO BROWSER DOWNLOAD. Playwright's CDN took this build down three times
      # in two days — hanging until the job died, erroring outright, then
      # hanging through all three retries until the 8-minute bound (K-22). The
      # GitHub runner image already ships Google Chrome, and the layout suite
      # drives it through the "chrome" channel, exactly as the developer
      # machine does (where the same CDN is blocked outright).
      #
      # TRADE-OFF, stated because it is a real one: CI now runs against the
      # runner's Chrome rather than Playwright's pinned Chromium, so the browser
      # version moves with the image instead of the lockfile. These are
      # assertion-based layout contracts with no pixel baselines, so a version
      # drift changes measurements only if it changes real layout — and CI and
      # local now agree, which removes a difference that cost a long
      # investigation when the two disagreed.
      - name: Confirm the runner's Chrome is there
        run: google-chrome --version

      - name: Start API and web for layout tests
        env:
          WEB_ORIGIN: http://localhost:3000
          AUTH_TOKEN_SECRET: ci-layout-secret
          # Both sides of the ISR purge: without it a freshly published
          # offering stays out of the public catalog for the whole revalidate
          # window, and the exit journey cannot see what it just published.
          REVALIDATE_SECRET: ci-revalidate-secret
          FUNDING_BANK_NAME: CI Test Bank
          FUNDING_ACCOUNT_HOLDER: Tokenization Platform (CI)
          FUNDING_ACCOUNT_NUMBER: IR000000000000000000000001
        run: |
          # stdbuf: Node block-buffers stdout when it is a file, so a crash
          # or error line can still be sitting in the buffer when a test
          # reads the log. Line buffering makes the log usable.
          stdbuf -oL -eL node services/api/dist/main.js > /tmp/api.log 2>&1 &
          REVALIDATE_SECRET=ci-revalidate-secret pnpm --filter @tokenization/web exec next start -p 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3001/public/offerings \
               && curl -sf -o /dev/null http://127.0.0.1:3000/en; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:3001/public/offerings || { echo "api did not start"; cat /tmp/api.log; exit 1; }
          curl -sf -o /dev/null http://127.0.0.1:3000/en || { echo "web did not start"; cat /tmp/web.log; exit 1; }

      # When a browser test fails, the reason is usually in the API's log — and
      # job logs need admin rights to read, while the step summary does not.
      # Putting the tail here makes a CI-only failure diagnosable at all.
      - name: Layout regression + Phase-2 exit journey
        env:
          # Unset on purpose: the config defaults to the "chrome" channel, and
          # the runner already has it. See "Confirm the runner's Chrome".
          WEB_BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:3001
          # Lets a failing seed step attach the server's own explanation.
          API_LOG_PATH: /tmp/api.log
        run: pnpm --filter @tokenization/web test:layout

      # Accessibility runs in its OWN Playwright invocation, deliberately.
      # Sharing a run with the journey put ten chain-free tests into the same
      # fullyParallel worker pool as the chain-heavy one, and the journey blew
      # its 240-second budget on `8dc1872` — the a11y tests were fine, they
      # just stole the machine. Separate lanes, and the journey keeps running
      # immediately after its devnet restart (K-23) as it did before.
      - name: Accessibility (WCAG 2.1 A/AA)
        timeout-minutes: 10
        env:
          WEB_BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:3001
        run: pnpm --filter @tokenization/web test:a11y

      # Playwright keeps a trace for every failed test (trace: retain-on-failure).
      # Without this upload that trace dies with the runner, and a CI-only
      # failure has to be guessed at from the outside — job logs need admin
      # rights to read, and step summaries are not exposed through the API at
      # all. The trace names the exact call that hung, which is the one fact
      # worth having.
      - name: Keep the Playwright trace when the browser tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: warn

      # Job logs need admin rights and artifacts need a token, so neither can be
      # read by someone holding only the repository's public API. A COMMIT
      # STATUS can. This publishes the failing test names and their first error
      # line there, which is the difference between diagnosing a CI-only
      # failure and guessing at it (KNOWN_ISSUES K-25).
      - name: Publish the failing test names where they can be read
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'apps/web/playwright-report.json';
            if (!fs.existsSync(path)) { core.info('no playwright json report'); return; }
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const failures = [];
            const walk = (suite) => {
              for (const spec of suite.specs ?? []) {
                for (const test of spec.tests ?? []) {
                  for (const result of test.results ?? []) {
                    if (result.status === 'failed' || result.status === 'timedOut') {
                      // The first line is often just "expect(locator).toBeVisible()".
                      // The line that names WHAT went wrong is the custom message,
                      // so prefer any line that reads like prose.
                      const lines = (result.error?.message ?? '')
                        .replace(/\u001b\[[0-9;]*m/g, '')
                        .split('\n')
                        .map((line) => line.trim())
                        .filter(Boolean);
                      const prose = lines.find((line) => /\s(never|but|not|->)\s/.test(line));
                      // How long it ran, and whether it TIMED OUT. Without this a
                      // status cannot tell "the assertion is wrong" from "the app
                      // was too slow" — the ambiguity that left a docs-only
                      // commit's a11y failure undiagnosable (KNOWN_ISSUES K-40).
                      const seconds = Math.round((result.duration ?? 0) / 1000);
                      const how = result.status === 'timedOut' ? 'timeout' : 'failed';
                      failures.push(
                        `${spec.title.slice(0, 30)} [${how} ${seconds}s] :: ${prose ?? lines[0] ?? ''}`.slice(0, 130),
                      );
                      // The message says WHICH expectation broke; the received
                      // value says what was actually there. Both, or the run
                      // reports half an answer (KNOWN_ISSUES K-25).
                      const received = lines.find((line) => line.startsWith('Received string:'));
                      if (received) failures.push(received.slice(0, 130));
                    }
                  }
                }
              }
              for (const child of suite.suites ?? []) walk(child);
            };
            for (const suite of report.suites ?? []) walk(suite);
            core.info(`failing specs: ${failures.length}`);
            for (const [i, description] of failures.slice(0, 8).entries()) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: 'failure',
                context: `browser-failure-${i + 1}`,
                description,
              });
            }

      # K-31: the API's OWN error, published where it can be read without admin
      # rights. Until now a failing journey left only the browser's view of it
      # ("tokenize failed (500)") while the cause sat in the step summary below,
      # which nobody outside the org can open — which is exactly why K-31 has
      # gone unexplained for weeks. Same fix K-25 applied to browser failures.
      #
      # The extraction lives in .github/scripts/api-log-failures.mjs so it can
      # be run against a real log and checked, rather than being untestable
      # inline YAML.
      - name: Publish the API's own error where it can be read
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { apiLogFailures } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/api-log-failures.mjs`
            );
            let contents = '';
            try {
              contents = fs.readFileSync(process.env.API_LOG_PATH || '/tmp/api.log', 'utf8');
            } catch {
              // The workflow's readiness check already reports a missing log.
              core.info('no api log to read');
              return;
            }
            const failures = apiLogFailures(contents);
            core.info(`api error lines: ${failures.length}`);
            for (const [i, description] of failures.entries()) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: 'failure',
                context: `api-failure-${i + 1}`,
                description,
              });
            }

      - name: Surface the API log when the browser tests fail
        if: failure()
        run: |
          {
            echo '### API log (last 120 lines)'
            echo '```'
            tail -n 120 /tmp/api.log || echo 'no api log'
            echo '```'
            echo '### Web log (last 40 lines)'
            echo '```'
            tail -n 40 /tmp/web.log || echo 'no web log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
